<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelStay | Reservaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link href="https://fonts.googleapis.com">
    <link href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

   <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow text-center">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold" href="reservation.html">
                🏨 HotelStay
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex gap-2">
                    <button id="logoutBtn" class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="d-flex flex-grow-1">
        <div class="sidebar bg-dark text-white p-3">
        <h4>Administración</h4>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="admin-dashboard.html" class="nav-link text-white active d-flex align-items-center gap-2 px-3 py-2 rounded text-secondary fw-medium">
                        <i class="bi bi-grid me-2"></i>
                        Inicio</a>
                </li>

                <li class="nav-item">
                    <a href="rooms.html" class="nav-link text-white active d-flex align-items-center gap-2 px-3 py-2 rounded text-secondary fw-medium">
                        <i class="bi bi-house-door me-2"></i>
                        Habitaciones</a>
                </li>

                <li class="nav-item">
                    <a href="typeRoom.html" class="nav-link text-white active d-flex align-items-center gap-2 px-3 py-2 rounded text-secondary fw-medium">
                        <i class="bi bi-door-open me-2"></i>
                        Tipo de Habitaciones</a>
                </li>

                <li class="nav-item">
                    <a href="bookings.html" class="nav-link text-white active d-flex align-items-center gap-2 px-3 py-2 rounded text-white fw-bold border-start border-3">
                        <i class="bi bi-calendar-event me-2"></i>
                        Reservaciones</a>
                </li>

                <li class="nav-item">
                    <a href="guests.html" class="nav-link text-white active d-flex align-items-center gap-2 px-3 py-2 rounded text-secondary fw-medium">
                        <i class="bi bi-people me-2"></i>
                        Huespedes</a>
                </li>
            </ul>
        </div>

        <main class="main-content p-4 flex-grow-1">
            <div class="text-center">
                <h1>Nuevo reservación</h1>
            </div>
            <div class="d-grid">
                <button
                    type="button"
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#addReservationModal"
                    id="openAddReservationBtn"
                >
                    <i class="bi bi-plus-lg"></i>
                    Agregar una nueva reservación.
                </button>
            </div>
            <div id="roomsContainer" class="row g-4 mb-4"></div>
        </main>
    </div>

    <!-- Modal editar perfil -->
  <div class="modal fade" id="addReservationModal" tabindex="-1" aria-labelledby="addReservationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg modal-profile">
        <div class="modal-header border-0 pb-0">
          <div>
            <h5 class="modal-title fw-bold" id="addReservationModalLabel">
              <i class="bi bi-calendar-check me-3 text-primary"></i>
              Agregar una nueva reservación.
            </h5>
            <p class="text-secondary small mb-0 mt-1">
              Ingresa los datos de la nueva reservación.
            </p>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body pt-3">
          <form id="addReservationForm" novalidate>
            <div class="mb-3">
              <label for="fullName" class="form-label">Nombre Completo</label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="fullNameGuest"
                required
              >
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input
                type="email"
                class="form-control form-control-lg"
                id="emailGuest"
                required
              >
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Número de Teléfono</label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="phoneGuest"
                required
              >
            </div>

            <div class="mb-3">
              <label for="adress" class="form-label">Dirección</label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="adressGuest"
                required
              >
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control form-control-lg"
                id="passwordGuest"
                required
              >
            </div>

            
            <div class="d-grid">
              <button type="submit" id="saveReservationBtn" class="btn btn-primary btn-lg">
                <i class="bi bi-check-circle me-2"></i>
                Registrar reservación
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

    

    <footer class="footer mt-auto py-3 bg-dark text-white-50 text-center">
        <div class="container">
            <small>&copy; 2026 HotelStay</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="assets/js/reservation.js"></script>
</body>
</html>
