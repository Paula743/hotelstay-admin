<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelStay - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com">
    <link href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                🏨 HotelStay
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex align-items-center gap-3">
                    <span id="userWelcome" class="text-white fw-medium small">
                        👋 ¡Bienvenid@!
                    </span>
                    <button id="logoutBtn" class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm">
                        Cerrar Sesión
                    </button>
                    <button id="editProfileBtn" class="btn btn-outline-light rounded-pill">
                        Editar perfil
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <header>
    </header>

    <main class="container my-5 flex-grow-1">
    <div class="row mb-5">
        <div class="col-12">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <h4 class="fw-bold text-dark mb-4">Introduce las fechas de tu estadía</h4>
                
                <form id="searchRoomsForm" class="row g-3 align-items-end">
                    <div class="col-12 col-md-4">
                        <label for="checkInDate" class="form-label small fw-semibold text-muted">Fecha de Entrada (Check-in)</label>
                        <input type="date" id="checkInDate" class="form-control form-control-lg rounded-3" required>
                    </div>
                    
                    <div class="col-12 col-md-4">
                        <label for="checkOutDate" class="form-label small fw-semibold text-muted">Fecha de Salida (Check-out)</label>
                        <input type="date" id="checkOutDate" class="form-control form-control-lg rounded-3" required>
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="guestsCount" class="form-label small fw-semibold text-muted">Huéspedes</label>
                        <input 
                            type="number" 
                            id="guestsCount" 
                            class="form-control form-control-lg rounded-3 text-center fw-medium" 
                            value="1" 
                            min="1" 
                            max="10" 
                            required
                        >
                    </div>
                    
                    <div class="col-12 col-md-4">
                        <button type="submit" id="searchRoomsBtn" class="btn btn-primary btn-lg w-100 rounded-3 fw-medium shadow-sm">
                            Buscar Disponibilidad
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 mb-3">
            <h3 class="fw-bold text-dark d-none" id="resultsTitle">Habitaciones Disponibles</h3>
            <p class="text-muted small d-none" id="resultsSubtitle">Selecciona el tipo de habitación que mejor se adapte a ti.</p>
        </div>
    </div>

</main>

    <footer class="footer mt-auto py-3 bg-dark text-white-50 text-center">
        <div class="container">
            <small>&copy; 2026 HotelStay</small>
        </div>
    </footer>

    <!-- Modal para Editar Perfil -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="editProfileModalLabel">Editar Perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editProfileForm">
                    <div class="modal-body">
                        <div id="profileMessage" class="alert alert-danger d-none" role="alert"></div>

                        <div class="mb-3">
                            <label for="editName" class="form-label small fw-medium">Nombre Completo</label>
                            <input type="text" class="form-control" id="editName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editEmail" class="form-label small fw-medium">Correo Electrónico</label>
                            <input type="email" class="form-control" id="editEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="editPhone" class="form-label small fw-medium">Número de Teléfono</label>
                            <input type="text" class="form-control" id="editPhone" required>
                        </div>
                        <div class="mb-3">
                            <label for="editAddress" class="form-label small fw-medium">Dirección</label>
                            <input type="text" class="form-control" id="editAddress" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="saveProfileBtn" class="btn btn-primary rounded-pill">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
