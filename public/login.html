<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelStay - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com">
    <link href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                🏨 HotelStay
            </a>
        </div>
    </nav>

    <main class="flex-shrink-0 my-auto py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    
                    <div class="card shadow-lg border-0 rounded-4 p-4">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <h2 class="fw-bold text-dark">Iniciar Sesión</h2>
                                <p class="text-muted small">Ingresa tus credenciales para acceder a tu perfil.</p>
                            </div>

                            <div id="errorMessage" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                                <span id="errorText">Usuario o contraseña incorrectos.</span>
                                <button type="button" class="btn-close" id="btnHideAlert" aria-label="Close"></button>
                            </div>

                            <form id="loginForm" class="needs-validation" novalidate>
                                
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label fw-medium">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="loginEmail" required>
                                </div>

                                <div class="mb-4">
                                    <label for="loginPassword" class="form-label fw-medium">Contraseña</label>
                                    <input type="password" class="form-control" id="loginPassword" required>
                                </div>

                                <div class="d-grid mb-3">
                                    <button id="loginBtn" type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm">
                                        Ingresar
                                    </button>
                                </div>

                                <div class="text-center mt-3">
                                    <span class="text-muted small">¿No tienes una cuenta?</span>
                                    <a href="register.html" class="text-primary small fw-bold text-decoration-none ms-1">Regístrate aquí</a>
                                </div>
                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer class="footer mt-auto py-3 bg-dark text-white-50 text-center">
        <div class="container">
            <small>&copy; 2026 HotelStay</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="assets/js/validators.js"></script>
    <script type="module" src="assets/js/login.js"></script>
</body>
</html>
